# ============================================================
#  Nginx config for Transmission on Hostinger VPS
#  Place at: /etc/nginx/sites-available/transmission
#  Enable:   ln -s /etc/nginx/sites-available/transmission /etc/nginx/sites-enabled/
#
#  Assumes:
#    - Next.js runs on port 3000  (pm2 / systemd)
#    - Django   runs on port 8000  (gunicorn / systemd)
#    - App root: /var/www/transmission
#    - Domain:   yourdomain.com  (replace below)
# ============================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # ── Redirect HTTP → HTTPS (uncomment after certbot setup) ──────────────
    # return 301 https://$host$request_uri;

    # ── Django API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django admin ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Django static (collectstatic output) ────────────────────────────────
    location /django-static/ {
        alias /var/www/transmission/apps/api/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media uploads (videos uploaded via admin panel) ──────────────
    location /media/ {
        alias /var/www/transmission/apps/api/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Stream large video files properly
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

    # ── Next.js public videos (hero, gearbox, 360) ─────────────────────────
    #    Nginx serves these directly — bypasses Node.js for heavy files
    location /videos/ {
        alias /var/www/transmission/apps/web/public/videos/;
        expires 7d;
        add_header Cache-Control "public";

        # Stream large video files properly
        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;
    }

    # ── Next.js app (everything else) ───────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

# ============================================================
#  HTTPS block — run: certbot --nginx -d yourdomain.com
#  Certbot will auto-populate this section.
# ============================================================
